name: Generate and Publish Quarto PDF

on:
  workflow_call:
    inputs:
      source_file_path:
        description: "Path to the Quarto source file (e.g., docs/milestone2/Etap2_Sprawozdanie.qmd)"
        required: true
        type: string
      publish_branch:
        description: "Branch name to publish the PDF to (e.g., pdf-reports)"
        required: true
        type: string
      commit_message:
        description: "Commit message for the PDF update"
        required: false
        type: string
        default: "docs: update PDF report"
  workflow_dispatch:
    inputs:
      source_file_path:
        description: "Path to the Quarto source file (e.g., docs/milestone2/Etap2_Sprawozdanie.qmd)"
        required: true
        type: string
      publish_branch:
        description: "Branch name to publish the PDF to (e.g., pdf-reports)"
        required: true
        type: string
      commit_message:
        description: "Commit message for the PDF update"
        required: false
        type: string
        default: "docs: update PDF report"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    outputs:
      pdf_filename: ${{ steps.pdf-info.outputs.pdf_filename }}
      source_dir: ${{ steps.paths.outputs.source_dir }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true

      - name: Extract source directory
        id: paths
        run: |
          SOURCE_FILE="${{ inputs.source_file_path }}"
          SOURCE_DIR=$(dirname "$SOURCE_FILE")
          SOURCE_FILENAME=$(basename "$SOURCE_FILE")
          echo "source_dir=$SOURCE_DIR" >> $GITHUB_OUTPUT
          echo "source_filename=$SOURCE_FILENAME" >> $GITHUB_OUTPUT
          echo "Source directory: $SOURCE_DIR"
          echo "Source filename: $SOURCE_FILENAME"

      # - name: Render Quarto Project to PDF
      #   uses: quarto-dev/quarto-actions/render@v2
      #   with:
      #     to: pdf
      #     path: ${{ steps.paths.outputs.source_dir }}

      - name: CLI Quarto Render to PDF
        run: |
          cd ${{ steps.paths.outputs.source_dir }}
          quarto render --to pdf

      - name: Get generated PDF filename
        id: pdf-info
        run: |
          cd ${{ steps.paths.outputs.source_dir }}
          PDF_FILE=$(ls -t *.pdf | head -1)
          echo "Generated PDF: $PDF_FILE"
          echo "pdf_filename=$PDF_FILE" >> $GITHUB_OUTPUT

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: quarto-pdf-report
          path: ${{ steps.paths.outputs.source_dir }}/${{ steps.pdf-info.outputs.pdf_filename }}
          if-no-files-found: error

      - name: Generate render summary
        run: |
          echo "## 📄 Quarto Render Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully rendered \`${{ inputs.source_file_path }}\` to PDF" >> $GITHUB_STEP_SUMMARY
          echo "📦 Artifact uploaded: **quarto-pdf-report**" >> $GITHUB_STEP_SUMMARY
          echo "📄 Generated: \`${{ steps.pdf-info.outputs.pdf_filename }}\`" >> $GITHUB_STEP_SUMMARY

  publish:
    needs: render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: quarto-pdf-report

      - name: Create fresh orphan branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan ${{ inputs.publish_branch }}
          git reset

      - name: Commit and push PDF
        run: |
          git add "${{ needs.render.outputs.pdf_filename }}"
          git commit -m "${{ inputs.commit_message }}"
          git push origin ${{ inputs.publish_branch }} --force

      - name: Generate publish summary
        run: |
          PDF_ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${{ needs.render.outputs.pdf_filename }}'))")
          echo "## 🚀 PDF Published Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Published to branch: \`${{ inputs.publish_branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "📄 [View PDF](https://github.com/${{ github.repository }}/blob/${{ inputs.publish_branch }}/${PDF_ENCODED})" >> $GITHUB_STEP_SUMMARY
